name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-python-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 core agents safety_sentinel data_ingestion --count --select=E9,F63,F7,F82 --show-source --statistics
          
      - name: Run Pytest
        env:
          PYTHONPATH: . # FIXED: Explicitly set PYTHONPATH to the project root
        run: |
          pytest tests/

  test-react-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web_dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend dependencies
        run: npm install

      - name: Lint Dashboard
        run: npm run lint
